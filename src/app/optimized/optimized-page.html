<div class="toolbar">
  <input type="search" placeholder="Search name, email or ID" (input)="onSearch($any($event.target).value)" />
  <select (change)="onStatus($any($event.target).value)">
    <option value="">All statuses</option>
    @for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }
  </select>
  <span class="count">Row {{ firstVisibleRow() }} of {{ rows().length }} · total {{ totalText() }}</span>
</div>
<app-metrics-bar />
<div class="table-wrap">
  <div class="table">
    <div class="row head">
      <button (click)="sortBy('id')">ID</button>
      <button (click)="sortBy('customer')">Customer</button>
      <span>Email</span>
      <button (click)="sortBy('city')">City</button>
      <button (click)="sortBy('product')">Product</button>
      <button (click)="sortBy('qty')">Qty</button>
      <span>Unit price</span>
      <button (click)="sortBy('discount')">Discount</button>
      <button (click)="sortBy('amount')">Total</button>
      <span>Status</span>
      <button (click)="sortBy('date')">Date</button>
    </div>
    <cdk-virtual-scroll-viewport class="table-body scroll" [itemSize]="rowHeight" (scrolledIndexChange)="onScrolledIndex($event)">
      <div *cdkVirtualFor="let o of rows(); trackBy: trackById" class="row">
        <span>{{ o.id }}</span>
        <span>{{ o.customer }}</span>
        <span>{{ o.email }}</span>
        <span>{{ o.city }}</span>
        <span>{{ o.product }}</span>
        <span>{{ o.qty }}</span>
        <span>{{ o.unitText }}</span>
        <span>{{ o.discountText }}</span>
        <span>{{ o.amountText }}</span>
        <span><i class="badge {{ o.status }}">{{ o.status }}</i></span>
        <span>{{ o.dateText }}</span>
      </div>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
